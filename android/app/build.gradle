plugins {
    id 'com.android.application'
}

def ksFile = rootProject.file('keystore.properties')
def hasKeystore = ksFile.exists()
def ks = new Properties()
if (hasKeystore) {
    ksFile.withInputStream { ks.load(it) }
}

android {
    namespace 'com.litledger.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.litledger.app'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.3.0'
    }

    if (hasKeystore) {
        signingConfigs {
            release {
                storeFile rootProject.file(ks.storeFile)
                storePassword ks.storePassword
                keyAlias ks.keyAlias
                keyPassword ks.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
