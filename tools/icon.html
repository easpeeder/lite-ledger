<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:512px;height:512px;overflow:hidden;background:#4f46e5}
  .icon{
    width:512px;height:512px;position:relative;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#4f46e5 0%,#6d28d9 55%,#7c3aed 100%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .ring{position:absolute;width:360px;height:360px;border:16px solid rgba(255,255,255,.13);border-radius:50%}
  .ring2{position:absolute;width:440px;height:440px;border:2px solid rgba(255,255,255,.10);border-radius:50%}
  .y{position:relative;color:#fff;font-size:290px;font-weight:700;line-height:1;margin-top:-18px;text-shadow:0 18px 40px rgba(0,0,0,.18)}
</style>
</head>
<body>
  <div class="icon">
    <div class="ring2"></div>
    <div class="ring"></div>
    <div class="y">&yen;</div>
  </div>
</body>
</html>
